name: EVO SBOM checks

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  sbom:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'

      - name: Validate lockfile
        run: node tests/sbom-v460.test.mjs

      - name: Generate and validate SPDX SBOM
        run: |
          npm sbom --sbom-format=spdx > EVO_SBOM.spdx.json
          node tests/sbom-v460.test.mjs EVO_SBOM.spdx.json
          sha256sum EVO_SBOM.spdx.json > EVO_SBOM.spdx.json.sha256

      - name: Upload SBOM evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: evo-protocol-spdx-sbom
          path: |
            EVO_SBOM.spdx.json
            EVO_SBOM.spdx.json.sha256
          retention-days: 30
          if-no-files-found: error
