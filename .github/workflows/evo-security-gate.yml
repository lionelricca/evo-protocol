name: EVO Security Gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  security-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check hardened Guardian UI
        run: node --check v1/guardian-v04.js
      - name: Run V3.3 security regression checks
        run: node tests/security-hardening-v330.test.js
      - name: Security gate scope
        run: echo "Trust authority, XSS escaping, secret exposure, dependency pinning and Edge request-size guards"
