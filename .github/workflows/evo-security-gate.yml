name: EVO Security Gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  security-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: evo_security_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d evo_security_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: evo_security_test
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 resolved 2026-08-21
        with:
          node-version: '24'
      - name: Syntax check browser shield
        run: node --check v1/security-bootstrap-v331.js
      - name: Syntax check hardened Guardian UI
        run: node --check v1/guardian-v04.js
      - name: Run V3.3.2 security regression checks
        run: node tests/security-hardening-v330.test.js
      - name: Guard atomic registration structure
        run: node tests/atomic-seal-v332.static.test.js
      - name: Prepare isolated PostgreSQL fixture
        run: psql -X -f tests/sql/atomic-seal-fixture-v332.sql
      - name: Apply proposed atomic registration migration
        run: psql -X -f supabase/migrations/20260821234000_atomic_seal_registration_credit.sql
      - name: Test atomic registration invariants
        run: psql -X -f tests/sql/atomic-seal-registration-v332.sql
      - name: Test concurrent wallet entitlement decisions
        run: bash tests/sql/atomic-seal-concurrency-v332.sh
      - name: Security gate scope
        run: echo "Trust authority, CSP/browser shield, XSS escaping, secrets, dependency pinning, Edge bounds, PostgreSQL atomicity, retry idempotency and concurrent entitlement safety"
