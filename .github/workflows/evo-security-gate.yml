name: EVO Security Gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  security-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: evo_security_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d evo_security_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: evo_security_test
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 resolved 2026-08-21
        with:
          node-version: '24'
      - name: Syntax check Browser Shield
        run: node --check v1/security-bootstrap-v331.js
      - name: Syntax check Guardian modules
        run: |
          node --check v1/guardian.js
          node --check v1/guardian-v04.js
      - name: Syntax check checkout
        run: node --check v1/checkout.js
      - name: Syntax check Issuer and wallet connector
        run: |
          node --check v1/issuer.js
          node --check v1/wallet-autoconnect.js
      - name: Syntax check Reality Continuity
        run: node --check supabase/functions/evo-reality-continuity/index.ts
      - name: Syntax check Passport owner event
        run: node --check supabase/functions/register-evo-passport-event/index.ts
      - name: Syntax check Passport transfer
        run: node --check supabase/functions/evo-passport-transfer/index.ts
      - name: Syntax check Battery Passport
        run: node --check supabase/functions/evo-battery-passport/index.ts
      - name: Run V3.3.2 security regression checks
        run: node tests/security-hardening-v330.test.js
      - name: Run V3.3.7 browser style CSP checks
        run: node tests/browser-shield-v333.test.js
      - name: Run V3.3.5 local QR supply-chain checks
        run: node tests/qrcode-vendor-v335.test.js
      - name: Run V3.3.6 root entrypoint checks
        run: node tests/root-entry-v336.test.js
      - name: Run V3.3.4 checkout hardening checks
        run: node tests/checkout-hardening-v334.test.js
      - name: Run V3.3.8 domain verification hardening checks
        run: node tests/domain-hardening-v338.test.js
      - name: Run V3.3.9 wallet and issuer hardening checks
        run: node tests/identity-hardening-v339.test.js
      - name: Run V3.3.10 organization submission hardening checks
        run: node tests/organization-hardening-v3310.test.js
      - name: Run V3.3.11 Reality Continuity hardening checks
        run: node tests/reality-continuity-hardening-v3311.test.js
      - name: Run V3.3.14 Battery Passport hardening checks
        run: node tests/battery-hardening-v3314.test.js
      - name: Guard atomic registration structure
        run: node tests/atomic-seal-v332.static.test.js
      - name: Prepare isolated PostgreSQL fixture
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/atomic-seal-fixture-v332.sql
      - name: Apply proposed atomic registration migration
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260821234000_atomic_seal_registration_credit.sql
      - name: Apply proposed active asset identity guard
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260821234200_active_asset_serial_guard.sql
      - name: Apply proposed checkout verification limits
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260821235500_checkout_verification_rate_limit.sql
      - name: Test atomic registration invariants
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/atomic-seal-registration-v332.sql
      - name: Test duplicate asset identity rollback
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/active-asset-serial-guard-v332.sql
      - name: Test concurrent wallet entitlement decisions
        run: bash tests/sql/atomic-seal-concurrency-v332.sh
      - name: Test checkout verification rate limits
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/checkout-rate-limit-v334.sql
      - name: Prepare Asset Authority fixture
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/asset-authority-fixture-v3312.sql
      - name: Apply Asset Authority Lock migration
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260822112500_asset_authority_lock_v3312.sql
      - name: Test Asset Authority ownership transition
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/asset-authority-v3312.sql
      - name: Apply Transfer State Machine migration
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260822113500_transfer_state_machine_v3313.sql
      - name: Test Transfer State Machine
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/transfer-state-machine-v3313.sql
      - name: Prepare Battery atomic fixture
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/battery-atomic-fixture-v3314.sql
      - name: Apply Battery atomic migration
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260822115000_battery_atomic_registration_v3314.sql
      - name: Test Battery atomic registration
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/battery-atomic-v3314.sql
      - name: Security gate scope
        run: echo "Trust authority, local QR supply-chain integrity, root-entry CSP, zero first-party runtime style creators, browser-module syntax, checkout cost controls, domain verification abuse bounds, proof-gated wallet persistence, organization pending uniqueness, Reality Continuity hardening, per-Seal Asset Authority serialization, atomic transfer offer/accept/cancel state machine, atomic Battery Passport plus initial audit version, DPP export claim guards, XSS escaping, secrets, dependency pinning, Edge bounds, PostgreSQL atomicity, retry idempotency, duplicate-identity rollback and ownership-transition safety"
