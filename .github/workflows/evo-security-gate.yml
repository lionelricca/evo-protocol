name: EVO Security Gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  security-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 resolved 2026-08-21
        with:
          node-version: '24'
      - name: Syntax check browser shield
        run: node --check v1/security-bootstrap-v331.js
      - name: Syntax check hardened Guardian UI
        run: node --check v1/guardian-v04.js
      - name: Run V3.3.1 security regression checks
        run: node tests/security-hardening-v330.test.js
      - name: Security gate scope
        run: echo "Trust authority, CSP/browser shield, XSS escaping, secret exposure, dependency pinning and Edge request-size guards"
