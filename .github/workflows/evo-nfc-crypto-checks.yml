name: EVO NFC Crypto checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  nfc-crypto:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 resolved 2026-08-21
        with:
          node-version: '24'
      - name: Syntax check shared NFC crypto
        run: node --check supabase/functions/_shared/evo-aes-cmac.mjs
      - name: Syntax check NFC verifier
        run: node --check supabase/functions/evo-nfc-verifier/index.ts
      - name: Validate NXP cryptographic reference vectors
        run: node tests/nfc-crypto-v440.test.mjs
      - name: Validate NFC secret and claim boundaries
        run: node tests/nfc-verifier-v440.test.js
      - name: Gate scope
        run: echo "NXP AN12196 Rev 2.0 AES-CMAC/SDM vectors, tampered-MAC rejection, server-only pilot keys, exact-origin browser boundary, enrolled UID binding and no NFC_CRYPTO_VERIFIED claim before atomic replay authority + physical pilot."
