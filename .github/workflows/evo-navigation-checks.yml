name: EVO navigation checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check navigation and language syntax
        run: |
          node --check v1/back-to-top.js
          node --check v1/i18n-v275.js
      - name: Run navigation and language regression checks
        run: |
          node tests/back-to-top.test.js
          node tests/i18n-v275.test.js
      - name: V2.7.5 scope
        run: echo "My EVO return and deterministic language switch"
