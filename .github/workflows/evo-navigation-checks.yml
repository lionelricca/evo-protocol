name: EVO navigation checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 resolved 2026-08-21
        with:
          node-version: '24'
      - name: Check navigation, language and session syntax
        run: |
          node --check v1/i18n-v275.js
          node --check v1/myevo-nav-v277.js
          node --check v1/wallet-session-v277.js
      - name: Run navigation, language and session regression checks
        run: |
          node tests/i18n-v275.test.js
          node tests/v277-session.test.js
      - name: V2.7.7 scope
        run: echo "My EVO as home + silent authorized-wallet session restore"
