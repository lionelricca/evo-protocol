name: EVO Origin Issuer Authority Checks

on:
  pull_request:
    paths:
      - 'v1/origin-authority-v323.js'
      - 'v1/origin-authority-v323.css'
      - 'v1/document-proof-v30.js'
      - 'tests/origin-authority-v323.test.js'
      - '.github/workflows/evo-origin-authority-checks.yml'
  push:
    paths:
      - 'v1/origin-authority-v323.js'
      - 'v1/origin-authority-v323.css'
      - 'v1/document-proof-v30.js'
      - 'tests/origin-authority-v323.test.js'
      - '.github/workflows/evo-origin-authority-checks.yml'

jobs:
  issuer-authority:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax checks
        run: |
          node --check v1/origin-authority-v323.js
          node --check v1/document-proof-v30.js
      - name: Run issuer authority regression checks
        run: node tests/origin-authority-v323.test.js
      - name: Claims policy
        run: echo "Free-text issuer labels are never elevated to verified organization identity"
