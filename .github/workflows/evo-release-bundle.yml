name: EVO Release Bundle

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Build auditable source bundle
        shell: bash
        env:
          CANDIDATE_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          set -euo pipefail

          SOURCE_SHA="$(git rev-parse HEAD)"
          VERSION="$(tr -d '\r\n' < VERSION)"
          test -n "$VERSION"
          SAFE_VERSION="$(printf '%s' "$VERSION" | tr -c 'A-Za-z0-9._-' '_')"
          ZIP_FILE="EVO_Protocol_${SAFE_VERSION}.zip"
          SHA_FILE="${ZIP_FILE}.sha256"

          printf '%s\n' "$SOURCE_SHA" > EVO_SOURCE_COMMIT.txt

          zip -qr "$ZIP_FILE" . \
            -x '.git/*' \
               "$ZIP_FILE" \
               "$SHA_FILE" \
               'EVO_Release_Manifest.txt'

          sha256sum "$ZIP_FILE" > "$SHA_FILE"
          ZIP_SHA256="$(cut -d ' ' -f1 "$SHA_FILE")"

          cat > EVO_Release_Manifest.txt <<EOF
          EVO Protocol Release Bundle
          version=$VERSION
          repository=$GITHUB_REPOSITORY
          source_commit=$SOURCE_SHA
          source_ref=$CANDIDATE_REF
          workflow_trigger_sha=$GITHUB_SHA
          workflow_ref=$GITHUB_REF
          workflow_run_id=$GITHUB_RUN_ID
          workflow_run_number=$GITHUB_RUN_NUMBER
          generated_at_utc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          zip_file=$ZIP_FILE
          zip_sha256=$ZIP_SHA256
          EOF

          test "$SOURCE_SHA" = "$(cat EVO_SOURCE_COMMIT.txt)"
          grep -F "version=$VERSION" EVO_Release_Manifest.txt
          grep -F "source_commit=$SOURCE_SHA" EVO_Release_Manifest.txt
          grep -F "zip_file=$ZIP_FILE" EVO_Release_Manifest.txt
          grep -F "zip_sha256=$ZIP_SHA256" EVO_Release_Manifest.txt

          printf 'EVO_BUNDLE_VERSION=%s\n' "$SAFE_VERSION" >> "$GITHUB_ENV"
          printf 'EVO_ZIP_FILE=%s\n' "$ZIP_FILE" >> "$GITHUB_ENV"
          printf 'EVO_SHA_FILE=%s\n' "$SHA_FILE" >> "$GITHUB_ENV"

      - name: Upload source ZIP and evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: evo-protocol-${{ env.EVO_BUNDLE_VERSION }}-source
          path: |
            ${{ env.EVO_ZIP_FILE }}
            ${{ env.EVO_SHA_FILE }}
            EVO_SOURCE_COMMIT.txt
            EVO_Release_Manifest.txt
          retention-days: 14
          if-no-files-found: error
