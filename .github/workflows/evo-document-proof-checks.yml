name: EVO Document Proof checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  document-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 resolved 2026-08-21
        with:
          node-version: '24'

      - name: Check browser module syntax
        run: |
          node --check v1/document-proof-v30.js
          node --check v1/document-lifecycle-v30.js
          node --check v1/document-management-v30.js
          node --check v1/organization-simple.js

      - name: Run Document Proof regression checks
        run: |
          node tests/document-proof-v30.test.js
          node tests/document-lifecycle-v30.test.js
