name: EVO Service Proof checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  service-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check Service Proof browser syntax
        run: node --check v1/service-proof-v31.js
      - name: Run Service Proof regression checks
        run: node tests/service-proof-v31.test.js
      - name: V3.1 scope
        run: echo "Owner-signed service evidence with optional designated-provider countersignature"
