name: EVO Service Proof checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  service-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 resolved 2026-08-21
        with:
          node-version: '24'
      - name: Check Service Proof browser syntax
        run: |
          node --check v1/service-proof-v31.js
          node --check v1/service-proof-v311-history.js
          node --check v1/service-proof-v312-trust.js
          node --check v1/service-provider-inbox-v313.js
      - name: Run Service Proof regression checks
        run: |
          node tests/service-proof-v31.test.js
          node tests/service-proof-history-v311.test.js
          node tests/service-proof-trust-v312.test.js
          node tests/service-provider-inbox-v313.test.js
      - name: V3.1 scope
        run: echo "Owner-signed service evidence, distinct provider countersignature, unified history and provider inbox"
