name: EVO Release Readiness checks

on:
  pull_request:
  push:
    branches:
      - main
      - codex/evo-v401-release-readiness

permissions:
  contents: read

jobs:
  release-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 resolved 2026-08-21
        with:
          node-version: '24'
      - name: Run complete JavaScript regression suite
        run: npm test
      - name: Validate V4 RC release metadata
        run: npm run test:release
